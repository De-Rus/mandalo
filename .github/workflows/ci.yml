name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build -p mandalo-cli
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The wire pins the browser engine is tested against are still what Rust sends
        run: node src/lib/web/parity-derive.mjs target/debug/mandalo

  editor-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor-extension
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: The committed prelude still matches crates/core/src/script.rs
        run: |
          node scripts/gen-prelude.mjs
          git diff --exit-code -- src/engine/prelude.generated.ts
      - name: Bundle the CLI so the e2e and parity suites really run
        run: node scripts/fetch-cli.mjs
      - run: pnpm run compile
      - name: Unit, e2e and CLI-parity suites
        run: npx vitest run
        env:
          MANDALO_REQUIRE_CLI: "1"
      - name: VS Code integration suite
        run: xvfb-run -a pnpm run test:integration

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The release scripts are clean shell
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -s sh scripts/install.sh
          shellcheck scripts/package-cli.sh scripts/release-notes.sh scripts/sync-packaging.sh \
            scripts/macos-sign.sh scripts/macos-notarize.sh scripts/build-sidecar.sh
      - name: The installer the site serves is the installer in the repo
        run: |
          diff -u scripts/install.sh landing/install.sh ||
            { echo "landing/install.sh is stale — run: cp scripts/install.sh landing/install.sh"; exit 1; }
      - name: The workflows themselves still lint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint

  mock-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The hosted worker serves the same routes as the Rust mock
        run: node --test crates/testkit/worker/contract.test.mjs
