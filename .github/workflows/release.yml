name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- desktop
  # tauri-action creates the draft release on its first run and uploads the
  # installers into it. Everything else attaches to the same draft afterwards.
  desktop:
    name: Desktop ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple silicon)
            platform: macos-14
            args: --target aarch64-apple-darwin
          - label: macOS (Intel)
            platform: macos-14
            args: --target x86_64-apple-darwin
          - label: macOS (universal)
            platform: macos-14
            args: --target universal-apple-darwin
          - label: Linux
            platform: ubuntu-22.04
            args: ""
          - label: Windows
            platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Mándalo ${{ github.ref_name }}"
          releaseDraft: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
      # workflow_dispatch has no tag to release into, so it only proves it builds.
      - uses: tauri-apps/tauri-action@v0
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

  # -------------------------------------------------------------------- cli
  cli:
    name: CLI ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install CLI build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --profile release-cli -p mandalo-cli --target ${{ matrix.target }}
      - name: Package
        id: pkg
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/package-cli.sh "$TARGET" "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: ${{ steps.pkg.outputs.asset }}
          if-no-files-found: error

  # -------------------------------------------------------------- extension
  # Platform VSIXs bundle the matching CLI binary; the "universal" one carries no
  # binary, so HTTP and GraphQL run in-process and gRPC asks for the CLI.
  # MANDALO_CLI_TARGET is set for the whole job because `vsce package` re-runs
  # `vscode:prepublish` -> fetch-cli.mjs, which would otherwise assume the host
  # and overwrite a cross-built binary with the runner's own architecture.
  extension:
    name: Extension ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-14
          - target: darwin-x64
            os: macos-14
            rust-target: x86_64-apple-darwin
          - target: linux-x64
            os: ubuntu-22.04
          - target: linux-arm64
            os: ubuntu-22.04-arm
          - target: win32-x64
            os: windows-latest
          - target: universal
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      MANDALO_CLI_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install CLI build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
        working-directory: editor-extension
      # The request editor webview is built from the root app. Without this step
      # the custom editor ships empty.
      - name: Build the request-editor webview
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:vscode
      - name: Read extension version
        id: meta
        shell: bash
        run: echo "version=$(node -p "require('./editor-extension/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Fetch or build the CLI
        working-directory: editor-extension
        run: node scripts/fetch-cli.mjs --target ${{ matrix.target }} --build
      - name: The VSIX carries the binary it claims to
        if: matrix.target != 'universal'
        working-directory: editor-extension
        shell: bash
        run: test -s "bin/mandalo" || test -s "bin/mandalo.exe"
      - name: Package VSIX
        working-directory: editor-extension
        shell: bash
        run: |
          set -euo pipefail
          out="mandalo-${{ matrix.target }}-${{ steps.meta.outputs.version }}.vsix"
          if [ "${{ matrix.target }}" = "universal" ]; then
            npx @vscode/vsce package --no-dependencies -o "$out"
          else
            npx @vscode/vsce package --target "${{ matrix.target }}" --no-dependencies -o "$out"
          fi
          ls -l "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: editor-extension/mandalo-${{ matrix.target }}-${{ steps.meta.outputs.version }}.vsix
          if-no-files-found: error

  # ---------------------------------------------------------------- publish
  # Everything lands on the one draft release: the desktop installers tauri-action
  # already pushed, plus the CLI archives, the VSIXs, and a SHA256SUMS covering
  # all of them.
  publish:
    name: Attach assets and write the notes
    needs: [desktop, cli, extension]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: cli-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: vsix-*
          merge-multiple: true
      - name: Collect the desktop installers already on the release
        run: |
          set -euo pipefail
          mkdir -p incoming
          gh release download "$TAG" --dir incoming --clobber \
            --pattern '*.dmg' --pattern '*.app.tar.gz' --pattern '*.msi' \
            --pattern '*-setup.exe' --pattern '*.AppImage' --pattern '*.deb' \
            --pattern '*.rpm' --pattern '*.sig' ||
            echo "no desktop installers matched — SHA256SUMS covers what is here"
          ls -l incoming
      - name: SHA256SUMS
        working-directory: incoming
        run: |
          set -euo pipefail
          rm -f SHA256SUMS
          # The redirection creates SHA256SUMS before find runs, so it must exclude itself.
          # shellcheck disable=SC2094  # -name SHA256SUMS is exactly that exclusion
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' |
            sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        run: bash scripts/release-notes.sh "$TAG" incoming > notes.md && cat notes.md
      - name: Upload
        run: |
          set -euo pipefail
          gh release upload "$TAG" incoming/* --clobber
          gh release edit "$TAG" --notes-file notes.md --draft
          echo "The release is still a DRAFT. Publish it or /releases/latest/download/ and install.sh will not resolve."

  # Publishing to the Marketplace is optional: without VSCE_PAT the release is
  # already complete, the VSIXs are simply downloaded instead of installed.
  marketplace:
    name: Publish to the VS Code Marketplace
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Detect Marketplace credentials
        id: creds
        run: |
          if [ -n "${VSCE_PAT:-}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "VSCE_PAT is not set — skipping the Marketplace publish. The VSIXs are on the release."
          fi
      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.publish == 'true'
        with:
          path: vsix
          pattern: vsix-*
          merge-multiple: true
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.publish == 'true'
        with:
          node-version: 22
      - name: Publish every platform VSIX
        if: steps.creds.outputs.publish == 'true'
        run: |
          set -euo pipefail
          for f in vsix/*.vsix; do
            npx @vscode/vsce publish --packagePath "$f"
          done
