openapi: 3.1.0
info:
  title: Tree
  version: "1.0.0"
servers:
  - url: https://tree.example.com
paths:
  /nodes:
    post:
      operationId: createNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Node"
      responses:
        "201":
          description: Created
  /graphs:
    post:
      operationId: createGraph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Left"
      responses:
        "201":
          description: Created
components:
  schemas:
    Node:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        parent:
          $ref: "#/components/schemas/Node"
        children:
          type: array
          items:
            $ref: "#/components/schemas/Node"
    Left:
      type: object
      properties:
        name:
          type: string
        right:
          $ref: "#/components/schemas/Right"
    Right:
      type: object
      properties:
        code:
          type: integer
        left:
          $ref: "#/components/schemas/Left"
