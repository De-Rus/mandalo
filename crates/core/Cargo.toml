[package]
name = "mandalo-core"
description = "Mándalo core — model, workspace, transport, assertions, scripts and the run pipeline"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "mandalo_core"

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
uuid.workspace = true
regex.workspace = true
git2.workspace = true
# Every TLS stack here reads the operating system trust store. tonic already did
# through `tls-roots`; with webpki roots on the others, one private or
# inspecting CA made HTTP and websockets fail where gRPC and curl succeeded.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "gzip", "brotli", "json", "multipart", "stream"] }
hyper = { version = "1", features = ["http1", "client"] }
percent-encoding = "2"
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
protox = "0.7"
http = "1"
rquickjs = "0.12"
serde_json_path = "0.7.2"
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls", "websocket"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_norway = "0.9.42"
tempfile.workspace = true

[dev-dependencies]
mandalo-testkit.workspace = true
git2.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1", features = ["net"] }
bytes = "1"
