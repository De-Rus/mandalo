[package]
name = "mandalo-core"
description = "Mándalo core — model, workspace, transport, assertions, scripts and the run pipeline"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "mandalo_core"

[features]
default = []
keychain = ["dep:keyring"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
uuid.workspace = true
regex.workspace = true
git2.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json", "multipart", "stream"] }
hyper = { version = "1", features = ["http1", "client"] }
percent-encoding = "2"
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
protox = "0.7"
http = "1"
rquickjs = "0.12"
serde_json_path = "0.7.2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"], optional = true }
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls", "websocket"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
mandalo-testkit.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1", features = ["net"] }
bytes = "1"
