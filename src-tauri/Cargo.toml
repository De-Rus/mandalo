[package]
name = "mandalo"
version = "0.1.0"
description = "Mándalo — a fast, offline, git-native API client"
authors = ["Dani Rus <dani@fsck.ro>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mandalo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json"] }
hyper = { version = "1", features = ["http1", "client"] }
percent-encoding = "2"
toml = "0.8"
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
protox = "0.7"
http = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1", features = ["net"] }
bytes = "1"
